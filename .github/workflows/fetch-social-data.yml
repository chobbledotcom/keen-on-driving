name: Fetch Reviews and Social Posts

on:
  schedule:
    # Every Monday at 9:00 AM UTC. The fetchers are incremental, so a run with
    # nothing new is cheap; Google reviews are re-read in full because there
    # are only a handful.
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: fetch-social-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Fetch Google reviews
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: bun scripts/fetch-google-reviews.js --all

      - name: Fetch Facebook posts
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: bun scripts/fetch-facebook-posts.js

      - name: Fetch Facebook reviews
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: bun scripts/fetch-facebook-reviews.js

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reviews/ _data/googleReviews.json facebook-posts/ images/facebook-posts/
          git commit -m "Auto-update: Fetch latest reviews and Facebook posts"
          git pull --rebase origin main
          git push
